<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="150" fill="#c084fc" opacity="0.1"/>
  <circle cx="1100" cy="530" r="200" fill="#f472b6" opacity="0.1"/>
  
  <!-- 3D cubes -->
  <g transform="translate(900, 150)">
    <rect x="0" y="0" width="60" height="60" fill="#6366f1" opacity="0.8"/>
    <rect x="20" y="-20" width="60" height="60" fill="#818cf8" opacity="0.6"/>
    <rect x="20" y="20" width="40" height="40" fill="#4f46e5" opacity="0.9"/>
  </g>
  
  <g transform="translate(150, 400)">
    <rect x="0" y="0" width="50" height="50" fill="#2d5a27" opacity="0.8"/>
    <rect x="15" y="-15" width="50" height="50" fill="#4ade80" opacity="0.5"/>
  </g>
  
  <!-- Main text -->
  <text x="600" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="url(#text)">
    SceneForge AI
  </text>
  
  <text x="600" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" text-anchor="middle" fill="#94a3b8">
    ElevenLabs × turbopuffer Hackathon
  </text>
  
  <text x="600" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="20" text-anchor="middle" fill="#64748b">
    AI-powered game scene generator with voice narration
  </text>
  
  <!-- Feature badges -->
  <g transform="translate(600, 480)" text-anchor="middle">
    <rect x="-280" y="0" width="120" height="36" rx="18" fill="#c084fc" opacity="0.2"/>
    <text x="-220" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#c084fc">🎵 ElevenLabs</text>
    
    <rect x="-60" y="0" width="120" height="36" rx="18" fill="#f472b6" opacity="0.2"/>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#f472b6">🔍 turbopuffer</text>
    
    <rect x="160" y="0" width="120" height="36" rx="18" fill="#6366f1" opacity="0.2"/>
    <text x="220" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#818cf8">🎮 Three.js</text>
  </g>
</svg>